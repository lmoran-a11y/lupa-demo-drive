<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupauto</title>
    <link rel="stylesheet" href="../style/index_style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1e293b] min-h-screen flex flex-col items-center">

    <div class="flex flex-col items-center justify-center w-full pt-12 pb-4">
        <img src="../Lupauto-logo.png" 
            alt="Lupauto Logo" 
            class="h-32 md:h-40 object-contain mix-blend-lighten drop-shadow-[0_0_20px_rgba(212,175,55,0.4)] hover:scale-105 transition-transform duration-500">
    </div>

    <div class="main-container flex flex-col items-center text-center px-4">
        <h1 class="title text-5xl font-black text-[#d4af37] mb-4">LUPAUTO</h1>
        
        <p>Accede a tu cuenta para gestionar tus reservas o crear una nueva en pocos pasos. Si aún no tienes cuenta, puedes registrarte y comenzar a usar Lupauto ahora mismo.</p>
        
        <div class="button-group flex gap-4">
            <a href="../page/login.html" class="btn-login px-8 py-3 bg-[#d4af37] text-[#1e293b] font-bold rounded-xl transition hover:bg-white">Login</a>
            <a href="../page/register.html" class="btn-register px-8 py-3 border-2 border-[#d4af37] text-[#d4af37] font-bold rounded-xl transition hover:bg-[#d4af37] hover:text-[#1e293b]">Registrarse</a>
        </div>
    </div>

</body>
</html>
